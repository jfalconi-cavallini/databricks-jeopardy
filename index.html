<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Jeopardy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial Black,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:.6vh 1vw;background:#0b1a5c;flex-wrap:wrap}
h1{margin:0;font-size:3.4vh;color:#ffcc00;letter-spacing:.08em;white-space:nowrap}
#help{font-size:2.2vh;color:#d5ddff;flex:1;text-align:center}
header button,.btn{font:inherit;font-size:2vh;padding:.7vh 1vw;background:#ff3621;color:#fff;border:0;border-radius:6px;cursor:pointer}
header button{margin-left:.4vw}
#board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:.5vh;padding:.5vh;background:#000;min-height:0}
.cat{background:#060ce9;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2.5vh;padding:1vh .4vw;min-height:8vh;text-transform:uppercase;line-height:1.15}
.tile{background:#060ce9;color:#ffcc00;font-size:6vh;display:flex;align-items:center;justify-content:center;cursor:pointer;text-shadow:3px 3px #000;user-select:none}
.tile:not(.used):hover{filter:brightness(1.2)}
.tile.used{background:#02064a;color:transparent;cursor:default}
#scores{display:flex;gap:1vw;padding:.6vh 1vw;background:#0b1a5c}
.player{flex:1;display:flex;align-items:center;justify-content:space-between;gap:.5vw;background:#060ce9;padding:1vh 1vw;border-radius:8px;border:4px solid transparent;min-width:0}
.player.lock{border-color:#ffcc00;box-shadow:0 0 20px #ffcc00}
.player input{font:inherit;font-size:3.2vh;background:transparent;color:#fff;border:0;width:30%;min-width:0}
.score{font-size:5.6vh;color:#fff;white-space:nowrap}
.score.neg{color:#ff6b6b}
.adj{white-space:nowrap}
.adj button{font:inherit;font-size:2.6vh;min-width:5vh;height:5vh;margin:0 .15vw;cursor:pointer}
.buzz{white-space:nowrap}
#modal{position:fixed;inset:0;background:#060ce9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2.5vh 3vw;text-align:center;z-index:5;overflow:auto}
#modal.show{display:flex}
#mlive{width:min(96vw,1600px);display:flex;justify-content:space-between;gap:2vw;font-size:3vh;color:#ffcc00;margin-bottom:1vh}
#mlive .hot{text-shadow:0 0 12px #ffcc00}
#mcat{font-size:3.2vh;color:#ffcc00;letter-spacing:.04em}
#mclue{font-size:4.2vh;margin:1.4vh 0 1.8vh;text-transform:uppercase;line-height:1.2;text-shadow:3px 3px #000;max-width:94vw}
#mopts{width:min(94vw,1500px);display:flex;flex-direction:column;gap:1.1vh}
.opt{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:3.3vh;text-align:left;padding:1.15vh 1.3vw;border-radius:12px;border:4px solid #fff;background:#0b1a5c;color:#fff;cursor:pointer;display:flex;align-items:center;gap:1vw;line-height:1.2;width:100%}
.opt:not(:disabled):hover{filter:brightness(1.12)}
.opt .key{flex:0 0 auto;background:#ffcc00;color:#000;font-family:Arial Black,Arial,sans-serif;font-size:2.8vh;width:5.6vh;height:5.6vh;border-radius:8px;display:flex;align-items:center;justify-content:center}
.opt .ltr{flex:0 0 auto;color:#ffcc00;font-family:Arial Black,Arial,sans-serif;font-size:3.2vh;width:4.2vh;text-align:center}
.opt .txt{flex:1}
.opt .badge{flex:0 0 auto;font-family:Arial Black,Arial,sans-serif;font-size:2.2vh;letter-spacing:.06em}
.opt.right{background:#0c6e32;border-color:#d6ff4a;box-shadow:0 0 24px rgba(214,255,74,.45)}
.opt.wrong{background:#7a1428;border-color:#ff8d8d}
.opt:disabled{cursor:default;opacity:1;color:#fff}
#mstatus{font-size:3.2vh;margin:1.5vh 0 1vh;line-height:1.35;max-width:94vw;min-height:4vh;white-space:pre-line}
#mbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:.6vw}
#mbtns .btn{font-size:2.8vh;padding:1.1vh 1.6vw}
input.w,input.secret{font-family:Arial,Helvetica,sans-serif;font-size:4vh;width:16vw;min-width:140px;text-align:center;border:0;border-radius:8px;padding:.4vh .6vw}
input.secret{-webkit-text-security:disc}
.wager-row{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:3.4vh;margin:.8vh 0}
</style>
</head>
<body>
<header>
  <h1>DATABRICKS JEOPARDY!</h1>
  <div id="help">A / L buzz · 1-4 pick A-D · Esc close · F fullscreen · M mute</div>
  <div>
    <button id="finalBtn" type="button">Final Jeopardy</button>
    <button id="muteBtn" type="button">Mute</button>
    <button id="fsBtn" type="button">Fullscreen</button>
    <button id="newBtn" type="button">New Game</button>
  </div>
</header>
<div id="board"></div>
<div id="scores"></div>
<div id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="mcat">
  <div id="mlive"></div>
  <div id="mcat"></div>
  <div id="mclue"></div>
  <div id="mopts"></div>
  <div id="mstatus" aria-live="polite"></div>
  <div id="mbtns"></div>
</div>
<script>
const VALS = [200, 400, 600, 800, 1000];
const KEY = 'dbjeopardy';
const CATS = [
  { name: 'Spark', clues: [
    ['This Spark abstraction is a distributed collection of data organized into named columns, like a table', 'DataFrame', 'RDD', 'Accumulator', 'Broadcast variable'],
    ['Transformations are lazy; these operations, such as count() or collect(), trigger actual execution', 'Actions', 'Transformations', 'Stages', 'Executors'],
    ['Operations like groupBy or join that require a shuffle of data across partitions are this type of transformation', 'Wide transformation', 'Narrow transformation', 'Action', 'Whole-stage codegen'],
    ['This DataFrame method reduces the number of partitions while avoiding a full shuffle', 'coalesce()', 'repartition()', 'repartitionByRange()', 'cache()'],
    ['This Spark SQL optimizer turns DataFrame and SQL queries into optimized execution plans', 'Catalyst', 'Tungsten', 'Photon', 'DAG scheduler']
  ]},
  { name: 'Delta Lake', clues: [
    ['Delta Lake stores table data files in this open-source columnar format', 'Parquet', 'ORC', 'Avro', 'JSON'],
    ["The Delta transaction log lives in this subdirectory of the table's location", '_delta_log', '_checkpoints', '_spark_metadata', '_delta_commit'],
    ['Using VERSION AS OF or TIMESTAMP AS OF to query an older table snapshot is called this', 'Time travel', 'RESTORE TABLE', 'Change data feed', 'VACUUM'],
    ['This command deletes data files no longer referenced by the table, with a default retention threshold of 7 days', 'VACUUM', 'OPTIMIZE', 'RESTORE TABLE', 'DELETE FROM'],
    ['This command compacts small files into larger ones; on tables without liquid clustering it can add ZORDER BY', 'OPTIMIZE', 'VACUUM', 'ANALYZE TABLE', 'CONVERT TO DELTA']
  ]},
  { name: 'Unity Catalog', clues: [
    ["In Unity Catalog's three-level namespace, this level comes first, before schema and table", 'Catalog', 'Metastore', 'Schema', 'Volume'],
    ['This SQL command gives a privilege such as SELECT on a table to a user or group', 'GRANT', 'REVOKE', 'SHOW GRANTS', 'ALTER'],
    ['This top-level Unity Catalog container stores metadata and is attached to workspaces in a region', 'Metastore', 'Catalog', 'Workspace', 'External location'],
    ['Unity Catalog automatically captures this, showing how data flows between tables and columns', 'Data lineage', 'Audit logs', 'Table history', 'Column masks'],
    ['This Unity Catalog object combines a storage credential with a cloud storage path', 'External location', 'Storage credential', 'External volume', 'External table']
  ]},
  { name: 'Databricks SQL', clues: [
    ['This compute resource runs SQL queries in Databricks SQL, available in serverless, pro and classic types', 'SQL warehouse', 'All-purpose cluster', 'Job cluster', 'Model serving endpoint'],
    ['This SQL statement upserts rows from a source into a Delta table using WHEN MATCHED / WHEN NOT MATCHED', 'MERGE INTO', 'INSERT INTO', 'UPDATE', 'COPY INTO'],
    ["This command shows a Delta table's version history, including operations and timestamps", 'DESCRIBE HISTORY', 'DESCRIBE DETAIL', 'DESCRIBE EXTENDED', 'SHOW PARTITIONS'],
    ['Known by its 4-letter acronym, this statement creates a table and fills it from a query in one step', 'CTAS (CREATE TABLE AS SELECT)', 'CREATE VIEW AS SELECT', 'INSERT INTO ... SELECT', 'CREATE TABLE LIKE'],
    ['This SQL command loads files into a Delta table idempotently, skipping files it has already loaded', 'COPY INTO', 'MERGE INTO', 'LOAD DATA', 'INSERT INTO']
  ]},
  { name: 'Data Engineering / ETL', clues: [
    ['In the medallion architecture, raw ingested data lands in this layer', 'Bronze', 'Silver', 'Gold', 'Platinum'],
    ['Auto Loader is invoked with this value passed to spark.readStream.format()', 'cloudFiles', 'autoloader', 'delta', 'parquet'],
    ['This medallion layer holds business-level aggregates ready for reporting', 'Gold', 'Bronze', 'Silver', 'Platinum'],
    ['In Lakeflow pipelines (formerly Delta Live Tables), these SQL boolean checks on each record can warn, drop the row, or fail the update', 'Expectations', 'CHECK constraints', 'Assertions', 'Lakehouse Monitoring'],
    ['This Structured Streaming option sets where progress info is stored so a query can recover after failure', 'checkpointLocation', 'watermark', 'outputMode', 'trigger']
  ]},
  { name: 'Lakehouse & Workflows', clues: [
    ["Databricks' term for an architecture combining the best of data lakes and data warehouses", 'Lakehouse', 'Data lake', 'Data warehouse', 'Medallion architecture'],
    ['A Databricks job is made up of one or more of these units of work, which can depend on each other', 'Tasks', 'Spark stages', 'Notebooks', 'Job runs'],
    ['Formerly called Repos, this feature syncs workspace code with a Git provider', 'Git folders', 'Repos', 'DBFS', 'GitHub Actions'],
    ['Unlike all-purpose compute, this classic compute type starts for a job run and terminates automatically when the run completes', 'Jobs compute (a job cluster)', 'All-purpose compute', 'SQL warehouse', 'Instance pool'],
    ['Developed by Databricks, this open protocol shares live Delta Lake and Parquet data across platforms without copying it', 'Delta Sharing (OpenSharing)', 'Lakehouse Federation', 'Deep clone', 'Partner Connect']
  ]}
];
const FINAL = {
  cat: 'Delta Lake',
  clue: "This Delta Lake feature rejects writes whose columns or data types don't match the table's schema",
  a: 'Schema enforcement',
  wrong: ['Schema evolution', 'Schema on read', 'Column mapping']
};

let S = null;
let cur = null;
let muted = false;
let actx = null;
let closeTimer = null;

function M(id) { return document.getElementById(id); }

function dollars(n) {
  const v = Number.isFinite(+n) ? Math.trunc(+n) : 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v);
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function buildDeck() {
  const deck = {};
  CATS.forEach((cat, c) => {
    cat.clues.forEach((clue, r) => {
      const options = shuffle([clue[1], clue[2], clue[3], clue[4]]);
      deck[c + '-' + r] = { options: options, correct: options.indexOf(clue[1]) };
    });
  });
  const options = shuffle([FINAL.a].concat(FINAL.wrong));
  deck.final = { options: options, correct: options.indexOf(FINAL.a) };
  return deck;
}

function fresh() {
  const names = (S && Array.isArray(S.names) && S.names.length === 2) ? S.names.slice() : ['Player 1', 'Player 2'];
  const pool = [];
  for (let c = 0; c < 6; c++) for (let r = 1; r < 5; r++) pool.push(c + '-' + r);
  const dd = [];
  while (dd.length < 2) {
    const k = pool[Math.floor(Math.random() * pool.length)];
    if (!dd.includes(k)) dd.push(k);
  }
  return { v: 2, names: names, scores: [0, 0], used: [], dd: dd, deck: buildDeck() };
}

function validState(s) {
  if (!s || s.v !== 2 || !s.deck || !Array.isArray(s.names) || s.names.length !== 2) return false;
  if (!Array.isArray(s.scores) || s.scores.length !== 2) return false;
  if (!Array.isArray(s.used) || !Array.isArray(s.dd) || s.dd.length !== 2 || s.dd[0] === s.dd[1]) return false;
  if (s.dd.some(k => !/^[0-5]-[1-4]$/.test(k))) return false;
  for (let c = 0; c < 6; c++) {
    for (let r = 0; r < 5; r++) {
      const d = s.deck[c + '-' + r];
      if (!d || !Array.isArray(d.options) || d.options.length !== 4) return false;
      if (!Number.isInteger(d.correct) || d.correct < 0 || d.correct > 3) return false;
    }
  }
  const f = s.deck.final;
  if (!f || !Array.isArray(f.options) || f.options.length !== 4) return false;
  if (!Number.isInteger(f.correct) || f.correct < 0 || f.correct > 3) return false;
  return true;
}

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!validState(S)) S = fresh();
  save();
}

function beep(freq, dur) {
  if (muted) return;
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.frequency.value = freq;
    o.connect(g);
    g.connect(actx.destination);
    g.gain.value = .2;
    o.start();
    o.stop(actx.currentTime + (dur || .2));
  } catch (e) {}
}

function render() {
  const b = M('board');
  b.textContent = '';
  CATS.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'cat';
    el.textContent = cat.name;
    b.appendChild(el);
  });
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 6; c++) {
      const k = c + '-' + r;
      const tile = document.createElement('div');
      const used = S.used.includes(k);
      tile.className = 'tile' + (used ? ' used' : '');
      tile.textContent = dollars(VALS[r]);
      tile.dataset.k = k;
      if (!used) tile.onclick = () => openClue(c, r);
      b.appendChild(tile);
    }
  }
  const scores = M('scores');
  scores.textContent = '';
  [0, 1].forEach(i => {
    const p = document.createElement('div');
    p.className = 'player' + (cur && !cur.final && cur.lock === i ? ' lock' : '');
    p.id = 'p' + i;
    const input = document.createElement('input');
    input.value = S.names[i];
    input.maxLength = 40;
    input.spellcheck = false;
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Player ' + (i + 1) + ' name');
    input.addEventListener('input', () => { S.names[i] = input.value; save(); });
    const adj = document.createElement('span');
    adj.className = 'adj';
    [-200, 200].forEach(delta => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = delta < 0 ? '\u2212' : '+';
      btn.setAttribute('aria-label', (delta < 0 ? 'Subtract' : 'Add') + ' 200 for ' + S.names[i]);
      btn.onclick = () => { S.scores[i] += delta; save(); render(); };
      adj.appendChild(btn);
    });
    const buzzBtn = document.createElement('button');
    buzzBtn.type = 'button';
    buzzBtn.className = 'btn buzz';
    buzzBtn.textContent = 'Buzz (' + (i ? 'L' : 'A') + ')';
    buzzBtn.onclick = () => buzz(i);
    const score = document.createElement('span');
    score.className = 'score' + (S.scores[i] < 0 ? ' neg' : '');
    score.id = 's' + i;
    score.textContent = dollars(S.scores[i]);
    p.append(input, adj, buzzBtn, score);
    scores.appendChild(p);
  });
  if (cur) liveScores();
}

function liveScores() {
  const el = M('mlive');
  el.textContent = '';
  [0, 1].forEach(i => {
    const span = document.createElement('span');
    if (cur && !cur.final && cur.lock === i) span.className = 'hot';
    span.textContent = S.names[i] + '  ' + dollars(S.scores[i]);
    el.appendChild(span);
  });
}

function showModal() {
  const m = M('modal');
  m.classList.add('show');
  m.setAttribute('aria-hidden', 'false');
  liveScores();
}

function hideModal() {
  const m = M('modal');
  m.classList.remove('show');
  m.setAttribute('aria-hidden', 'true');
}

function setButtons(specs) {
  const box = M('mbtns');
  box.textContent = '';
  specs.forEach(spec => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn';
    if (spec.id) b.id = spec.id;
    b.textContent = spec.label;
    b.onclick = spec.on;
    box.appendChild(b);
  });
}

function clueButtons() {
  const specs = [];
  const optionsUp = M('mopts').children.length > 0;
  if (cur && !cur.final && !cur.dd && !cur.done && !cur.resolved && cur.lock === null && optionsUp) {
    [0, 1].forEach(i => {
      if (!cur.out.includes(i)) {
        specs.push({
          id: 'buzz' + i,
          label: 'Buzz ' + (S.names[i] || ('Player ' + (i + 1))) + ' (' + (i ? 'L' : 'A') + ')',
          on: () => buzz(i)
        });
      }
    });
  }
  specs.push({ id: 'closeBtn', label: 'Close (Esc)', on: closeClue });
  return specs;
}

function currentDeck() {
  if (!cur) return null;
  return cur.final ? S.deck.final : S.deck[cur.k];
}

function paint() {
  const d = currentDeck();
  M('mopts').querySelectorAll('.opt').forEach(btn => {
    const i = +btn.dataset.i;
    const wrong = !!(cur && cur.eliminated && cur.eliminated.includes(i));
    const right = !!(cur && cur.resolved && d && i === d.correct);
    btn.classList.toggle('wrong', wrong);
    btn.classList.toggle('right', right);
    btn.disabled = !!(cur && (wrong || cur.resolved));
    let badge = btn.querySelector('.badge');
    if (right || wrong) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'badge';
        btn.appendChild(badge);
      }
      badge.textContent = right ? 'CORRECT' : 'WRONG';
    } else if (badge) {
      badge.remove();
    }
  });
}

function renderOpts(onPick) {
  const d = currentDeck();
  const box = M('mopts');
  box.textContent = '';
  d.options.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.dataset.i = String(i);
    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = String(i + 1);
    const ltr = document.createElement('span');
    ltr.className = 'ltr';
    ltr.textContent = 'ABCD'[i];
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    btn.append(key, ltr, txt);
    btn.addEventListener('click', () => onPick(i));
    box.appendChild(btn);
  });
  paint();
}

function scheduleClose() {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => {
    if (cur && cur.done && !cur.final) closeClue();
  }, 2200);
}

function openClue(c, r) {
  const k = c + '-' + r;
  if (S.used.includes(k) || cur) return;
  cur = {
    k: k, c: c, r: r, val: VALS[r], lock: null, out: [], eliminated: [],
    dd: S.dd.includes(k), resolved: false, done: false, clueShown: false, final: false
  };
  M('mcat').textContent = CATS[c].name + ' - ' + dollars(VALS[r]);
  M('mopts').textContent = '';
  M('mstatus').textContent = '';
  if (cur.dd) {
    beep(880, .6);
    M('mclue').textContent = 'DAILY DOUBLE!';
    M('mstatus').textContent = 'Who found it?';
    setButtons([
      { id: 'who0', label: S.names[0], on: () => ddPick(0) },
      { id: 'who1', label: S.names[1], on: () => ddPick(1) }
    ]);
    showModal();
  } else {
    showClue();
    showModal();
  }
}

function ddPick(i) {
  if (!cur || !cur.dd || cur.clueShown) return;
  const max = Math.max(S.scores[i], 1000);
  cur.lock = i;
  cur.ddMax = max;
  const status = M('mstatus');
  status.textContent = '';
  const row = document.createElement('div');
  row.className = 'wager-row';
  row.append(document.createTextNode(S.names[i] + ', wager (max ' + dollars(max) + '): '));
  const input = document.createElement('input');
  input.className = 'w';
  input.id = 'wager';
  input.type = 'number';
  input.min = '0';
  input.max = String(max);
  input.value = String(Math.min(1000, max));
  row.appendChild(input);
  status.appendChild(row);
  setButtons([
    { id: 'ddGo', label: 'Show clue', on: ddGo },
    { id: 'closeBtn', label: 'Close (Esc)', on: closeClue }
  ]);
  liveScores();
  render();
  input.focus();
  input.select();
}

function clampWager(raw, max) {
  const n = Math.floor(Number(raw));
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(max, n));
}

function ddGo() {
  if (!cur || !cur.dd || cur.clueShown) return;
  const input = M('wager');
  if (!input || cur.lock === null) return;
  cur.val = clampWager(input.value, cur.ddMax);
  cur.clueShown = true;
  showClue();
  M('mcat').textContent = CATS[cur.c].name + ' - Daily Double - ' + dollars(cur.val);
  M('mstatus').textContent = S.names[cur.lock] + ' wagered ' + dollars(cur.val) + '. Pick 1-4.';
  render();
}

function showClue() {
  M('mclue').textContent = CATS[cur.c].clues[cur.r][0];
  cur.clueShown = true;
  renderOpts(choose);
  if (!cur.dd) M('mstatus').textContent = 'Buzz in with A or L, then pick 1-4.';
  setButtons(clueButtons());
  showModal();
}

function buzz(i) {
  if (!cur || cur.final || cur.dd || cur.done || cur.resolved) return;
  if (cur.lock !== null || cur.out.includes(i)) return;
  if (!M('mopts').children.length) return;
  cur.lock = i;
  beep(i ? 660 : 440, .3);
  M('mstatus').textContent = S.names[i] + ', pick 1-4.';
  setButtons(clueButtons());
  render();
}

function choose(i) {
  if (!cur || cur.final || cur.done || cur.resolved) return;
  if (!M('mopts').children.length) return;
  if (cur.eliminated.includes(i)) return;
  if (cur.lock === null) {
    M('mstatus').textContent = 'Buzz in first (A or L), then pick 1-4.';
    return;
  }
  const d = currentDeck();
  const player = cur.lock;
  if (i === d.correct) {
    S.scores[player] += cur.val;
    cur.done = true;
    cur.resolved = true;
    if (!S.used.includes(cur.k)) S.used.push(cur.k);
    save();
    beep(990, .25);
    paint();
    M('mstatus').textContent = S.names[player] + ' is correct! +' + dollars(cur.val) + ' - ' + 'ABCD'[i] + '. ' + d.options[i];
    setButtons([{ id: 'closeBtn', label: 'Close (Esc)', on: closeClue }]);
    render();
    scheduleClose();
    return;
  }
  S.scores[player] -= cur.val;
  cur.eliminated.push(i);
  cur.out.push(player);
  cur.lock = null;
  save();
  beep(150, .5);
  const canSteal = !cur.dd && cur.out.length < 2;
  if (!canSteal) {
    cur.resolved = true;
    cur.done = true;
    if (!S.used.includes(cur.k)) S.used.push(cur.k);
    save();
    paint();
    M('mstatus').textContent = S.names[player] + ' is wrong. -' + dollars(cur.val) + '. Correct: ' + 'ABCD'[d.correct] + '. ' + d.options[d.correct];
    setButtons([{ id: 'closeBtn', label: 'Close (Esc)', on: closeClue }]);
  } else {
    paint();
    const other = 1 - player;
    M('mstatus').textContent = S.names[player] + ' is wrong (-' + dollars(cur.val) + '). ' + S.names[other] + ' may buzz and pick from what is left.';
    setButtons(clueButtons());
  }
  render();
}

function closeClue() {
  if (!cur) return;
  clearTimeout(closeTimer);
  if (!cur.final && !S.used.includes(cur.k)) S.used.push(cur.k);
  save();
  cur = null;
  hideModal();
  render();
}

function finalJ() {
  if (cur) return;
  cur = { k: 'final', final: true, phase: 'wager', picks: [null, null], w: [0, 0], eliminated: [], resolved: false, scored: false, lock: null };
  M('mcat').textContent = 'FINAL JEOPARDY - ' + FINAL.cat;
  M('mclue').textContent = 'Enter secret wagers. The clue comes next.';
  M('mopts').textContent = '';
  const status = M('mstatus');
  status.textContent = '';
  [0, 1].forEach(i => {
    const max = Math.max(0, S.scores[i]);
    const row = document.createElement('div');
    row.className = 'wager-row';
    row.append(document.createTextNode(S.names[i] + ' (max ' + dollars(max) + '): '));
    const input = document.createElement('input');
    input.className = 'secret';
    input.id = 'fw' + i;
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.setAttribute('aria-label', S.names[i] + ' secret wager');
    row.appendChild(input);
    status.appendChild(row);
  });
  setButtons([
    { id: 'showClue', label: 'Show clue', on: finalClue },
    { id: 'closeBtn', label: 'Close (Esc)', on: closeClue }
  ]);
  showModal();
  M('fw0').focus();
}

function finalClue() {
  if (!cur || !cur.final || cur.phase !== 'wager') return;
  cur.w = [0, 1].map(i => clampWager(M('fw' + i).value, Math.max(0, S.scores[i])));
  showFinalPick(0);
}

function showFinalPick(player) {
  cur.phase = player === 0 ? 'p1' : 'p2';
  cur.resolved = false;
  M('mcat').textContent = 'FINAL JEOPARDY - ' + FINAL.cat;
  M('mclue').textContent = FINAL.clue;
  renderOpts(secretPick);
  M('mstatus').textContent = S.names[player] + ', pick in secret. Press 1-4 or click. ' + S.names[1 - player] + ', look away.';
  setButtons([{ id: 'closeBtn', label: 'Close (Esc)', on: closeClue }]);
  liveScores();
}

function secretPick(i) {
  if (!cur || !cur.final || cur.resolved || cur.scored) return;
  if (i < 0 || i > 3) return;
  if (cur.phase === 'p1') {
    cur.picks[0] = i;
    showHandoff();
  } else if (cur.phase === 'p2') {
    cur.picks[1] = i;
    revealFinal();
  }
}

function showHandoff() {
  cur.phase = 'handoff';
  M('mopts').textContent = '';
  M('mclue').textContent = S.names[0] + ' is locked in.';
  M('mstatus').textContent = 'Hand the keyboard to ' + S.names[1] + '.';
  setButtons([
    { id: 'p2go', label: S.names[1] + ', show the clue', on: () => showFinalPick(1) },
    { id: 'closeBtn', label: 'Close (Esc)', on: closeClue }
  ]);
}

function revealFinal() {
  if (!cur || !cur.final || cur.scored) return;
  cur.scored = true;
  cur.phase = 'reveal';
  cur.resolved = true;
  const d = S.deck.final;
  cur.eliminated = [];
  const lines = [0, 1].map(i => {
    const pick = cur.picks[i];
    const ok = pick === d.correct;
    S.scores[i] += ok ? cur.w[i] : -cur.w[i];
    if (pick !== null && pick !== d.correct) cur.eliminated.push(pick);
    const label = pick === null ? 'nothing' : ('ABCD'[pick] + '. ' + d.options[pick]);
    return S.names[i] + ' wagered ' + dollars(cur.w[i]) + ' and picked ' + label + ' - ' + (ok ? 'correct' : 'wrong') + ' - now ' + dollars(S.scores[i]);
  });
  save();
  M('mclue').textContent = FINAL.clue;
  renderOpts(() => {});
  paint();
  M('mstatus').textContent = lines.join('\n');
  setButtons([{ id: 'closeBtn', label: 'Done (Esc)', on: closeClue }]);
  if (cur.picks[0] === d.correct || cur.picks[1] === d.correct) beep(990, .25);
  else beep(150, .5);
  render();
}

function onKey(e) {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape') { e.preventDefault(); closeClue(); }
    else if (e.key === 'Enter' && cur && cur.dd && e.target.id === 'wager') { e.preventDefault(); ddGo(); }
    return;
  }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'a') { e.preventDefault(); buzz(0); }
  else if (k === 'l') { e.preventDefault(); buzz(1); }
  else if (k === '1' || k === '2' || k === '3' || k === '4') {
    e.preventDefault();
    const idx = k.charCodeAt(0) - 49;
    if (cur && cur.final) secretPick(idx);
    else choose(idx);
  } else if (k === ' ') {
    if (cur) e.preventDefault();
  } else if (k === 'Escape') closeClue();
  else if (k === 'f') fs();
  else if (k === 'm') mute();
}

function fs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

function mute() {
  muted = !muted;
  M('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
}

M('fsBtn').onclick = fs;
M('muteBtn').onclick = mute;
M('finalBtn').onclick = finalJ;
M('newBtn').onclick = () => {
  if (!confirm('Start a new game? Every answer will be reshuffled.')) return;
  clearTimeout(closeTimer);
  S = fresh();
  save();
  cur = null;
  hideModal();
  render();
};
document.addEventListener('keydown', onKey);

window.__PACK = {
  names: CATS.map(cat => cat.name),
  clues: CATS.map(cat => cat.clues.map(clue => ({
    q: clue[0],
    a: clue[1],
    wrong: [clue[2], clue[3], clue[4]]
  }))),
  final: { cat: FINAL.cat, clue: FINAL.clue, a: FINAL.a, wrong: FINAL.wrong.slice() }
};

load();
render();
</script>
</body>
</html>
