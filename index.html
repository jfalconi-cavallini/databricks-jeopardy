input.secret{-webkit-text-security:disc}
.wager-row{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:3vh;margin:.6vh 0}

function checkPack() {
  const ids = new Set();
  function one(c, expectDomain) {
    if (!c || typeof c.id !== 'string' || ids.has(c.id)) throw new Error('bad id ' + (c && c.id));
    ids.add(c.id);
    if (!DOMAINS.includes(c.domain)) throw new Error('domain ' + c.id);
    if (expectDomain && c.domain !== expectDomain) throw new Error('domain mismatch ' + c.id);
    const opts = [c.a].concat(c.wrong);
    if (opts.length !== 4 || new Set(opts).size !== 4 || opts.some(function (x) { return typeof x !== 'string' || !x; })) {
      throw new Error('options ' + c.id);
    }
    if (typeof c.q !== 'string' || !c.q.trim()) throw new Error('question ' + c.id);
    if (typeof c.code !== 'string') throw new Error('code ' + c.id);
  }
  if (CATS.length !== DOMAINS.length) throw new Error('category count');
  CATS.forEach(function (cat) {
    if (cat.name !== cat.domain || !DOMAINS.includes(cat.domain)) throw new Error('category ' + cat.name);
    if (!Array.isArray(cat.pools) || cat.pools.length !== VALS.length) throw new Error('pools ' + cat.name);
    cat.pools.forEach(function (pool) {
      if (!Array.isArray(pool) || pool.length !== 4) throw new Error('pool size ' + cat.name);
      pool.forEach(function (c) { one(c, cat.domain); });
    });
  });
  if (FINALS.length !== 4) throw new Error('finals');
  FINALS.forEach(function (c) { one(c, null); });
}
checkPack();

let S = null;

function M(id) { return document.getElementById(id); }

function dollars(n) {
  const v = Number.isFinite(+n) ? Math.trunc(+n) : 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v);
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function toDeck(clue) {
  const options = shuffle([clue.a, clue.wrong[0], clue.wrong[1], clue.wrong[2]]);
  return {
    id: clue.id,
    domain: clue.domain,
    q: clue.q,
    code: clue.code || '',
    options: options,
    correct: options.indexOf(clue.a)
  };
}

function takeClue(pool, seen) {
  let choices = pool.filter(function (c) { return seen.indexOf(c.id) === -1; });
  if (!choices.length) {
    const drop = {};
    pool.forEach(function (c) { drop[c.id] = true; });
    seen = seen.filter(function (id) { return !drop[id]; });
    choices = pool.slice();
  }
  const clue = choices[Math.floor(Math.random() * choices.length)];
  seen = seen.concat([clue.id]);
  return { clue: clue, seen: seen };
}

function fresh() {
  const names = (S && Array.isArray(S.names) && S.names.length === 2) ? S.names.slice() : ['Player 1', 'Player 2'];
  let seen = (S && Array.isArray(S.seen)) ? S.seen.filter(function (id) { return typeof id === 'string'; }) : [];
  const deck = {};
  CATS.forEach(function (cat, c) {
    cat.pools.forEach(function (pool, r) {
      const picked = takeClue(pool, seen);
      seen = picked.seen;
      deck[c + '-' + r] = toDeck(picked.clue);
    });
  });
  const fin = takeClue(FINALS, seen);
  seen = fin.seen;
  deck.final = toDeck(fin.clue);
  const pool = [];
  for (let c = 0; c < CATS.length; c++) {
    for (let r = 1; r < VALS.length; r++) pool.push(c + '-' + r);
  }
  const dd = [];
  while (dd.length < 2) {
    const k = pool[Math.floor(Math.random() * pool.length)];
    if (dd.indexOf(k) === -1) dd.push(k);
  }
  return { v: 3, names: names, scores: [0, 0], used: [], seen: seen, dd: dd, deck: deck };
}

function validEntry(d) {
  if (!d || typeof d.id !== 'string' || !DOMAINS.includes(d.domain)) return false;
  if (typeof d.q !== 'string' || typeof d.code !== 'string') return false;
  if (!Array.isArray(d.options) || d.options.length !== 4 || new Set(d.options).size !== 4) return false;
  if (!Number.isInteger(d.correct) || d.correct < 0 || d.correct > 3) return false;
  return true;
}

function validDd(k) {
  const m = /^(\d+)-([1-4])$/.exec(k);
  if (!m) return false;
  const c = +m[1];
  return c >= 0 && c < CATS.length;
}

function validState(s) {
  if (!s || s.v !== 3 || !s.deck || !Array.isArray(s.names) || s.names.length !== 2) return false;
  if (!Array.isArray(s.scores) || s.scores.length !== 2) return false;
  if (!Array.isArray(s.used) || !Array.isArray(s.seen) || s.seen.some(function (id) { return typeof id !== 'string'; })) return false;
  if (!Array.isArray(s.dd) || s.dd.length !== 2 || s.dd[0] === s.dd[1]) return false;
  if (s.dd.some(function (k) { return !validDd(k); })) return false;
  for (let c = 0; c < CATS.length; c++) {
    for (let r = 0; r < VALS.length; r++) {
      if (!validEntry(s.deck[c + '-' + r])) return false;
    }
  }
  return validEntry(s.deck.final);
}

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!validState(S)) {
    const prev = S;
    S = {
      seen: prev && Array.isArray(prev.seen) ? prev.seen.filter(function (id) { return typeof id === 'string'; }) : [],
      names: prev && Array.isArray(prev.names) && prev.names.length === 2 ? prev.names.slice() : ['Player 1', 'Player 2']
    };
    S = fresh();
  }
  save();
}

function beep(freq, dur) {
  if (muted) return;
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.frequency.value = freq;
    o.connect(g);
    g.connect(actx.destination);
    g.gain.value = .2;
    o.start();
    o.stop(actx.currentTime + (dur || .2));
  } catch (e) {}
}

function render() {
  const b = M('board');
  b.textContent = '';
  CATS.forEach(function (cat) {
    const el = document.createElement('div');
    el.className = 'cat';
    el.textContent = cat.name;
    b.appendChild(el);
  });
  for (let r = 0; r < VALS.length; r++) {
    for (let c = 0; c < CATS.length; c++) {
      const k = c + '-' + r;
      const tile = document.createElement('div');
      const used = S.used.indexOf(k) !== -1;
      tile.className = 'tile' + (used ? ' used' : '');
      tile.textContent = dollars(VALS[r]);
      tile.dataset.k = k;
      if (!used) tile.onclick = function () { openClue(c, r); };
      b.appendChild(tile);
    }
  }
  const scores = M('scores');
  scores.textContent = '';
  [0, 1].forEach(function (i) {
    const p = document.createElement('div');
    p.className = 'player' + (cur && !cur.final && cur.lock === i ? ' lock' : '');
    p.id = 'p' + i;
    const input = document.createElement('input');
    input.value = S.names[i];
    input.maxLength = 40;
    input.spellcheck = false;
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Player ' + (i + 1) + ' name');
    input.addEventListener('input', function () { S.names[i] = input.value; save(); });
    const adj = document.createElement('span');
    adj.className = 'adj';
    [-200, 200].forEach(function (delta) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = delta < 0 ? '\u2212' : '+';
      btn.setAttribute('aria-label', (delta < 0 ? 'Subtract' : 'Add') + ' 200 for ' + S.names[i]);
      btn.onclick = function () { S.scores[i] += delta; save(); render(); };
      adj.appendChild(btn);
    });
    const keys = document.createElement('span');
    keys.className = 'keys';
    keys.textContent = i === 0 ? '1 2 3 4' : '7 8 9 0';
    keys.setAttribute('aria-label', 'Player ' + (i + 1) + ' answer keys');
    const score = document.createElement('span');
    score.className = 'score' + (S.scores[i] < 0 ? ' neg' : '');
    score.id = 's' + i;
    score.textContent = dollars(S.scores[i]);
    p.append(input, adj, keys, score);
    scores.appendChild(p);
  });
  if (cur) liveScores();
}

function liveScores() {
  const el = M('mlive');
  el.textContent = '';
  [0, 1].forEach(function (i) {
    const span = document.createElement('span');
    if (cur && !cur.final && cur.lock === i) span.className = 'hot';
    span.textContent = S.names[i] + '  ' + dollars(S.scores[i]);
    el.appendChild(span);
  });
}

function showModal() {
  const m = M('modal');
  m.classList.add('show');
  m.setAttribute('aria-hidden', 'false');
  liveScores();
}

function hideModal() {
  const m = M('modal');
  m.classList.remove('show');
  m.setAttribute('aria-hidden', 'true');
}

function setDomain(domain) {
  const el = M('mdomain');
  el.textContent = domain || '';
  el.hidden = !domain;
}

function setClue(text, code) {
  const box = M('mclue');
  box.textContent = '';
  const q = document.createElement('div');
  q.className = 'qtext';
  q.textContent = text || '';
  box.appendChild(q);
  if (code) {
    const pre = document.createElement('pre');
    pre.className = 'code';
    pre.textContent = code;
    box.appendChild(pre);
  }
}

function clearOpts() {
  M('mopts').textContent = '';
  M('mlegend').textContent = '';
}

function setButtons(specs) {
  const box = M('mbtns');
  box.textContent = '';
  specs.forEach(function (spec) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn';
    if (spec.id) b.id = spec.id;
    b.textContent = spec.label;
    b.onclick = spec.on;
    box.appendChild(b);
  });
}

function closeSpec() {
  return { id: 'closeBtn', label: cur && cur.final && cur.scored ? 'Done (Esc)' : 'Close (Esc)', on: closeClue };
}

function currentDeck() {
  if (!cur) return null;
  return cur.final ? S.deck.final : S.deck[cur.k];
}

function allowedPlayers() {
  if (!cur || !cur.clueShown || cur.done || cur.resolved) return [];
  if (cur.final) {
    if (cur.phase === 'p1') return [0];
    if (cur.phase === 'p2') return [1];
    return [];
  }
  if (cur.dd) return cur.lock === null ? [] : [cur.lock];
  return [0, 1].filter(function (p) { return cur.out.indexOf(p) === -1; });
}

function keyList(player) {
  return player === 0 ? '1 2 3 4' : '7 8 9 0';
}

function paint() {
  const d = currentDeck();
  const allowed = allowedPlayers();
  M('mopts').querySelectorAll('.opt').forEach(function (row) {
    const i = +row.dataset.i;
    const wrong = !!(cur && cur.eliminated && cur.eliminated.indexOf(i) !== -1);
    const right = !!(cur && cur.resolved && d && i === d.correct);
    row.classList.toggle('wrong', wrong);
    row.classList.toggle('right', right);
    row.querySelectorAll('.key').forEach(function (btn) {
      const player = +btn.dataset.player;
      btn.disabled = !!(wrong || (cur && cur.resolved) || allowed.indexOf(player) === -1);
    });
    let badge = row.querySelector('.badge');
    if (right || wrong) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'badge';
        row.appendChild(badge);
      }
      badge.textContent = right ? 'CORRECT' : 'WRONG';
    } else if (badge) {
      badge.remove();
    }
  });
}

function renderOpts() {
  const d = currentDeck();
  const box = M('mopts');
  box.textContent = '';
  M('mlegend').textContent = 'P1: 1 2 3 4 = A B C D    ·    P2: 7 8 9 0 = A B C D';
  d.options.forEach(function (text, i) {
    const row = document.createElement('div');
    row.className = 'opt';
    row.dataset.i = String(i);
    [0, 1].forEach(function (player) {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'key ' + (player ? 'p2' : 'p1');
      key.dataset.player = String(player);
      const who = document.createElement('small');
      who.textContent = player ? 'P2' : 'P1';
      const face = document.createElement('span');
      face.textContent = (player ? P2_KEYS : P1_KEYS)[i];
      key.append(who, document.createTextNode(' '), face);
      key.setAttribute('aria-label', 'Player ' + (player + 1) + ' answer ' + 'ABCD'[i] + ', key ' + face.textContent);
      key.addEventListener('click', function () {
        if (cur && cur.final) finalKey(player, i);
        else answer(player, i);
      });
      row.appendChild(key);
    });
    const ltr = document.createElement('span');
    ltr.className = 'ltr';
    ltr.textContent = 'ABCD'[i];
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    row.append(ltr, txt);
    box.appendChild(row);
  });
  paint();
}

function scheduleClose() {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(function () {
    if (cur && cur.done && !cur.final) closeClue();
  }, 2200);
}

function openClue(c, r) {
  const k = c + '-' + r;
  if (S.used.indexOf(k) !== -1 || cur) return;
  const entry = S.deck[k];
  cur = {
    k: k, c: c, r: r, val: VALS[r], lock: null, out: [], eliminated: [],
    dd: S.dd.indexOf(k) !== -1, resolved: false, done: false, clueShown: false, final: false
  };
  clearOpts();
  M('mstatus').textContent = '';
  setDomain(entry.domain);
  if (cur.dd) {
    beep(880, .6);
    M('mcat').textContent = CATS[c].name + ' - ' + dollars(VALS[r]);
    setClue('DAILY DOUBLE!', '');
    M('mstatus').textContent = 'Who found it?';
    setButtons([
      { id: 'who0', label: S.names[0], on: function () { ddPick(0); } },
      { id: 'who1', label: S.names[1], on: function () { ddPick(1); } }
    ]);
    showModal();
  } else {
    M('mcat').textContent = CATS[c].name + ' - ' + dollars(VALS[r]);
    showClue();
    showModal();
  }
}

function ddPick(i) {
  if (!cur || !cur.dd || cur.clueShown) return;
  const max = Math.max(S.scores[i], 1000);
  cur.lock = i;
  cur.ddMax = max;
  const status = M('mstatus');
  status.textContent = '';
  const row = document.createElement('div');
  row.className = 'wager-row';
  row.append(document.createTextNode(S.names[i] + ', wager (max ' + dollars(max) + '): '));
  const input = document.createElement('input');
  input.className = 'w';
  input.id = 'wager';
  input.type = 'number';
  input.min = '0';
  input.max = String(max);
  input.value = String(Math.min(1000, max));
  row.appendChild(input);
  status.appendChild(row);
  setButtons([
    { id: 'ddGo', label: 'Show clue', on: ddGo },
    closeSpec()
  ]);
  liveScores();
  render();
  input.focus();
  input.select();
}

function clampWager(raw, max) {
  const n = Math.floor(Number(raw));
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(max, n));
}

function ddGo() {
  if (!cur || !cur.dd || cur.clueShown) return;
  const input = M('wager');
  if (!input || cur.lock === null) return;
  cur.val = clampWager(input.value, cur.ddMax);
  cur.clueShown = true;
  showClue();
  M('mcat').textContent = CATS[cur.c].name + ' - Daily Double - ' + dollars(cur.val);
  M('mstatus').textContent = S.names[cur.lock] + ' wagered ' + dollars(cur.val) + '. Only ' + S.names[cur.lock] + ' answers, with ' + keyList(cur.lock) + '.';
  render();
}

function showClue() {
  const entry = S.deck[cur.k];
  setDomain(entry.domain);
  setClue(entry.q, entry.code);
  cur.clueShown = true;
  renderOpts();
  if (!cur.dd) {
    M('mstatus').textContent = 'First key locks the answer. P1 uses 1 2 3 4. P2 uses 7 8 9 0.';
  }
  setButtons([closeSpec()]);
  showModal();
}

function answer(player, idx) {
  if (!cur || cur.final || cur.done || cur.resolved || !cur.clueShown) return;
  if (!M('modal').classList.contains('show')) return;
  if (!M('mopts').children.length) return;
  if (idx < 0 || idx > 3) return;
  if (allowedPlayers().indexOf(player) === -1) return;
  if (cur.eliminated.indexOf(idx) !== -1) {
    M('mstatus').textContent = 'That answer is already out. Pick another.';
    return;
  }
  cur.lock = player;
  const d = currentDeck();
  if (idx === d.correct) {
    S.scores[player] += cur.val;
    cur.done = true;
    cur.resolved = true;
    if (S.used.indexOf(cur.k) === -1) S.used.push(cur.k);
    save();
    beep(990, .25);
    paint();
    M('mstatus').textContent = d.domain + ' · ' + S.names[player] + ' is correct! +' + dollars(cur.val) + ' - ' + 'ABCD'[idx] + '. ' + d.options[idx];
    setButtons([closeSpec()]);
    render();
    scheduleClose();
    return;
  }
  S.scores[player] -= cur.val;
  cur.eliminated.push(idx);
  cur.out.push(player);
  cur.lock = null;
  save();
  beep(150, .5);
  const canSteal = !cur.dd && cur.out.length < 2;
  if (!canSteal) {
    cur.resolved = true;
    cur.done = true;
    if (S.used.indexOf(cur.k) === -1) S.used.push(cur.k);
    save();
    paint();
    M('mstatus').textContent = d.domain + ' · ' + S.names[player] + ' is wrong. -' + dollars(cur.val) + '. Correct: ' + 'ABCD'[d.correct] + '. ' + d.options[d.correct];
    setButtons([closeSpec()]);
  } else {
    paint();
    const other = 1 - player;
    M('mstatus').textContent = S.names[player] + ' is wrong (-' + dollars(cur.val) + '). ' + S.names[other] + ' may steal with ' + keyList(other) + '.';
    setButtons([closeSpec()]);
  }
  render();
}

function closeClue() {
  if (!cur) return;
  clearTimeout(closeTimer);
  if (!cur.final && S.used.indexOf(cur.k) === -1) S.used.push(cur.k);
  save();
  cur = null;
  setDomain('');
  clearOpts();
  hideModal();
  render();
}

function finalJ() {
  if (cur) return;
  const d = S.deck.final;
  cur = { k: 'final', final: true, phase: 'wager', picks: [null, null], w: [0, 0], eliminated: [], resolved: false, scored: false, lock: null, clueShown: false, done: false };
  setDomain(d.domain);
  M('mcat').textContent = 'FINAL JEOPARDY - ' + d.domain;
  setClue('Enter secret wagers. The clue comes next.', '');
  clearOpts();
  const status = M('mstatus');
  status.textContent = '';
  [0, 1].forEach(function (i) {
    const max = Math.max(0, S.scores[i]);
    const row = document.createElement('div');
    row.className = 'wager-row';
    row.append(document.createTextNode(S.names[i] + ' (max ' + dollars(max) + '): '));
    const input = document.createElement('input');
    input.className = 'secret';
    input.id = 'fw' + i;
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.setAttribute('aria-label', S.names[i] + ' secret wager');
    row.appendChild(input);
    status.appendChild(row);
  });
  setButtons([
    { id: 'showClue', label: 'Show clue', on: finalClue },
    closeSpec()
  ]);
  showModal();
  M('fw0').focus();
}

function finalClue() {
  if (!cur || !cur.final || cur.phase !== 'wager') return;
  cur.w = [0, 1].map(function (i) { return clampWager(M('fw' + i).value, Math.max(0, S.scores[i])); });
  showFinalPick(0);
}

function showFinalPick(player) {
  const d = S.deck.final;
  cur.phase = player === 0 ? 'p1' : 'p2';
  cur.clueShown = true;
  cur.resolved = false;
  setDomain(d.domain);
  M('mcat').textContent = 'FINAL JEOPARDY - ' + d.domain;
  setClue(d.q, d.code);
  renderOpts();
  M('mstatus').textContent = S.names[player] + ', lock a secret pick with ' + keyList(player) + '. ' + S.names[1 - player] + ', look away.';
  setButtons([closeSpec()]);
  liveScores();
}

function finalKey(player, idx) {
  if (!cur || !cur.final || cur.resolved || cur.scored) return;
  if (idx < 0 || idx > 3) return;
  if (cur.phase === 'p1' && player === 0) secretPick(idx);
  else if (cur.phase === 'p2' && player === 1) secretPick(idx);
}

function secretPick(i) {
  if (!cur || !cur.final || cur.resolved || cur.scored) return;
  if (i < 0 || i > 3) return;
  if (cur.phase === 'p1') {
    cur.picks[0] = i;
    showHandoff();
  } else if (cur.phase === 'p2') {
    cur.picks[1] = i;
    revealFinal();
  }
}

function showHandoff() {
  cur.phase = 'handoff';
  cur.clueShown = false;
  clearOpts();
  setClue(S.names[0] + ' is locked in.', '');
  M('mstatus').textContent = 'Hand the keyboard to ' + S.names[1] + '.';
  setButtons([
    { id: 'p2go', label: S.names[1] + ', show the clue', on: function () { showFinalPick(1); } },
    closeSpec()
  ]);
}

function revealFinal() {
  if (!cur || !cur.final || cur.scored) return;
  cur.scored = true;
  cur.phase = 'reveal';
  cur.resolved = true;
  cur.clueShown = true;
  const d = S.deck.final;
  setDomain(d.domain);
  cur.eliminated = [];
  const lines = [0, 1].map(function (i) {
    const pick = cur.picks[i];
    const ok = pick === d.correct;
    S.scores[i] += ok ? cur.w[i] : -cur.w[i];
    if (pick !== null && pick !== d.correct && cur.eliminated.indexOf(pick) === -1) cur.eliminated.push(pick);
    const label = pick === null ? 'nothing' : ('ABCD'[pick] + '. ' + d.options[pick]);
    return S.names[i] + ' wagered ' + dollars(cur.w[i]) + ' and picked ' + label + ' - ' + (ok ? 'correct' : 'wrong') + ' - now ' + dollars(S.scores[i]);
  });
  save();
  setClue(d.q, d.code);
  renderOpts();
  paint();
  M('mstatus').textContent = d.domain + '\n' + lines.join('\n');
  setButtons([closeSpec()]);
  if (cur.picks[0] === d.correct || cur.picks[1] === d.correct) beep(990, .25);
  else beep(150, .5);
  render();
}

function onKey(e) {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape') { e.preventDefault(); closeClue(); }
    else if (e.key === 'Enter' && cur && cur.dd && e.target.id === 'wager') { e.preventDefault(); ddGo(); }
    return;
  }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Escape' || e.key === 'Escape') { closeClue(); return; }
  if (k === 'f') { fs(); return; }
  if (k === 'm') { mute(); return; }
  if (k === ' ') { if (cur) e.preventDefault(); return; }
  let player = null;
  let idx = null;
  if (Object.prototype.hasOwnProperty.call(P1_CODE, e.code)) { player = 0; idx = P1_CODE[e.code]; }
  else if (Object.prototype.hasOwnProperty.call(P2_CODE, e.code)) { player = 1; idx = P2_CODE[e.code]; }
  else return;
  e.preventDefault();
  if (!cur) return;
  if (cur.final) finalKey(player, idx);
  else answer(player, idx);
}

function fs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function () {});
}

function mute() {
  muted = !muted;
  M('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
}

M('fsBtn').onclick = fs;
M('muteBtn').onclick = mute;
M('finalBtn').onclick = finalJ;
M('newBtn').onclick = function () {
  if (!confirm('Start a new game? New clues will be dealt, skipping ones this browser has already seen.')) return;
  clearTimeout(closeTimer);
  S = fresh();
  save();
  cur = null;
  setDomain('');
  clearOpts();
  hideModal();
  render();
};
document.addEventListener('keydown', onKey);

window.__PACK = {
  domains: DOMAINS.slice(),
  names: CATS.map(function (cat) { return cat.name; }),
  keys: { p1: P1_KEYS.slice(), p2: P2_KEYS.slice(), letters: ['A', 'B', 'C', 'D'] },
  clues: CATS.map(function (cat) {
    return cat.pools.map(function (pool) {
      return pool.map(function (c) {
        return { id: c.id, domain: c.domain, q: c.q, code: c.code, a: c.a, wrong: c.wrong.slice() };
      });
    });
  }),
  finals: FINALS.map(function (c) {
    return { id: c.id, domain: c.domain, q: c.q, code: c.code, a: c.a, wrong: c.wrong.slice() };
  })
};

window.__debug = {
  setSeen: function (ids) {
    S.seen = ids.slice();
    save();
  },
  forceSlot: function (k, entry) {
    S.deck[k] = entry;
    S.used = S.used.filter(function (x) { return x !== k; });
    save();
    if (!cur) render();
  }
};

load();
render();
</script>
</body>
</html>
